<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #ffffff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: #ffffff;
            padding: 40px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .profile-section {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ddd;
        }
        
        .profile-info h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #333;
            font-weight: normal;
        }
        
        .profile-summary {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 30px;
            max-width: 800px;
            text-align: left;
        }
        
        .contact-info {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .contact-item {
            color: #333;
            text-decoration: none;
            font-size: 0.95em;
        }
        
        .contact-item:hover {
            color: #666;
            text-decoration: underline;
        }
        
        .research-tabs {
            background: #ffffff;
            margin-bottom: 40px;
        }
        
        .tabs-header {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            gap: 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .tab-button {
            padding: 15px 30px;
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 1em;
            font-weight: normal;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            border-bottom: 2px solid transparent;
        }
        
        .tab-button:hover, .tab-button.active {
            color: #333;
            border-bottom: 2px solid #333;
            text-decoration: none;
            background: transparent;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .content-section {
            background: #ffffff;
            margin-bottom: 40px;
        }
        
        .content-section h2 {
            font-size: 1.8em;
            margin-bottom: 25px;
            color: #333;
            font-weight: normal;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
        }
        
        .content-section h3 {
            font-size: 1.4em;
            margin-bottom: 20px;
            color: #333;
            font-weight: normal;
        }
        
        .content-section h4 {
            font-size: 1.1em;
            margin: 20px 0 10px 0;
            color: #333;
            font-weight: bold;
        }
        
        .project-item {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .project-item:last-child {
            border-bottom: none;
        }
        
        .project-title {
            color: #333;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .timeline-item {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .timeline-item:last-child {
            border-bottom: none;
        }
        
        .timeline-date {
            color: #666;
            font-weight: normal;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .timeline-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .timeline-company {
            color: #666;
            font-weight: normal;
            margin-bottom: 10px;
        }
        
        ul {
            margin: 15px 0;
            padding-left: 20px;
        }
        
        li {
            margin-bottom: 8px;
        }
        
        .publication-item, .patent-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .publication-item:last-child, .patent-item:last-child {
            border-bottom: none;
        }
        
        .award-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .award-item:last-child {
            border-bottom: none;
        }
        
        a {
            color: #333;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        .back-link {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .back-link a {
            color: #666;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .profile-section {
                flex-direction: column;
                text-align: center;
            }
            
            .profile-info h1 {
                font-size: 2em;
            }
            
            .contact-info {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            
            .tabs-header {
                flex-direction: column;
                align-items: center;
            }
            
            .tab-button {
                width: 200px;
                text-align: center;
            }
            
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        {{ content }}
    </div>
    
    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(function(content) {
                content.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-button').forEach(function(button) {
                button.classList.remove('active');
            });
            
            var selectedContent = document.getElementById(tabId);
            if (selectedContent) {
                selectedContent.classList.add('active');
            }
            
            event.target.classList.add('active');
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            var firstTab = document.querySelector('.tab-button');
            var firstContent = document.querySelector('.tab-content');
            
            if (firstTab && firstContent) {
                firstTab.classList.add('active');
                firstContent.classList.add('active');
            }
        });
    </script>
</body>
</html>
