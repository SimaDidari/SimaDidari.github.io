<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:        #ffffff;
            --surface:   #f7f8fa;
            --surface-2: #eef1f5;
            --text:      #14181f;
            --muted:     #5b6474;
            --accent:    #1d5c86;
            --accent-soft: #e7f0f7;
            --border:    #e2e6ec;
            --shadow:    0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .05);
            --radius:    12px;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg:        #0f1216;
                --surface:   #161b22;
                --surface-2: #1c222b;
                --text:      #e6e9ee;
                --muted:     #99a3b2;
                --accent:    #7ab8e3;
                --accent-soft: #16242f;
                --border:    #242b35;
                --shadow:    0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
            }
        }

        :root[data-theme="dark"] {
            --bg:        #0f1216;
            --surface:   #161b22;
            --surface-2: #1c222b;
            --text:      #e6e9ee;
            --muted:     #99a3b2;
            --accent:    #7ab8e3;
            --accent-soft: #16242f;
            --border:    #242b35;
            --shadow:    0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; scroll-padding-top: 80px; }

        body {
            font-family: var(--sans);
            font-size: 18px;
            line-height: 1.65;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1020px;
            margin: 0 auto;
            padding-inline: 24px;
        }

        /* ---------- Nav ---------- */
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            max-width: 1020px;
            margin: 0 auto;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-brand {
            font-family: var(--serif);
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -.01em;
            color: var(--text);
            text-decoration: none;
            white-space: nowrap;
            flex: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            min-width: 0;          /* let the flex item shrink instead of widening the page */
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-links::-webkit-scrollbar { display: none; }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: .95rem;
            padding: 6px 10px;
            border-radius: 7px;
            white-space: nowrap;
            transition: color .15s, background .15s;
        }

        .nav-links a:hover,
        .nav-links a[aria-current="page"] {
            color: var(--text);
            background: var(--surface-2);
        }

        .theme-toggle {
            flex: none;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: color .15s, border-color .15s;
        }
        .theme-toggle:hover { color: var(--text); border-color: var(--muted); }
        .theme-toggle svg { width: 16px; height: 16px; }

        /* ---------- Hero ---------- */
        .hero { padding: 64px 0 48px; }

        .hero-top {
            display: flex;
            align-items: center;
            gap: 28px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .profile-image {
            width: 116px;
            height: 116px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
            flex: none;
        }

        .hero h1 {
            font-family: var(--serif);
            font-size: clamp(2.1rem, 5vw, 2.9rem);
            font-weight: 600;
            letter-spacing: -.02em;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .hero-role {
            color: var(--muted);
            font-size: 1.1rem;
        }

        .hero-role strong { color: var(--text); font-weight: 500; }

        .hero-summary {
            font-size: 1.14rem;
            color: var(--muted);
            max-width: 65ch;
        }
        .hero-summary p + p { margin-top: 14px; }

        .contact-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 26px;
        }

        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 13px;
            font-size: .95rem;
            color: var(--muted);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 999px;
            transition: all .15s;
        }

        .contact-item:hover {
            color: var(--text);
            border-color: var(--muted);
            text-decoration: none;
        }

        .contact-icon { width: 15px; height: 15px; flex: none; }

        /* ---------- Sections ---------- */
        .content-section { padding: 40px 0; border-top: 1px solid var(--border); }
        .hero + .content-section { border-top: none; padding-top: 0; }

        .section-label {
            font-size: .82rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .content-section h2 {
            font-family: var(--serif);
            font-size: 2.05rem;
            font-weight: 600;
            letter-spacing: -.015em;
            margin-bottom: 8px;
        }

        .section-intro {
            color: var(--muted);
            max-width: 65ch;
            margin-bottom: 28px;
        }

        .content-section h3 {
            font-family: var(--serif);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .content-section h4 {
            font-size: .86rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 24px 0 12px;
        }

        /* ---------- Tabs ---------- */
        .tabs-header {
            display: flex;
            gap: 6px;
            padding: 5px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 11px;
            margin-bottom: 28px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs-header::-webkit-scrollbar { display: none; }

        .tab-button {
            flex: 1;
            min-width: max-content;
            padding: 9px 16px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-family: var(--sans);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
        }

        .tab-button:hover { color: var(--text); }

        .tab-button.active {
            background: var(--bg);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fade .25s ease; }

        @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        .tab-panel-body { color: var(--muted); max-width: 65ch; }

        /* ---------- Cards & lists ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 24px;
        }

        .card + .card { margin-top: 14px; }

        .pill-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; padding: 0; }

        .pill-list li {
            margin: 0;
            font-size: .92rem;
            color: var(--muted);
            background: var(--surface-2);
            border-radius: 999px;
            padding: 5px 12px;
        }

        ul.bullets { margin: 0 0 8px; padding-left: 20px; }
        ul.bullets li { margin-bottom: 7px; color: var(--muted); }
        ul.bullets li strong { color: var(--text); font-weight: 500; }

        /* ---------- Publications ---------- */
        .publication-item {
            padding: 18px 0;
            border-bottom: 1px solid var(--border);
        }
        .publication-item:first-of-type { padding-top: 0; }
        .publication-item:last-of-type { border-bottom: none; padding-bottom: 0; }

        .pub-title {
            font-family: var(--serif);
            font-size: 1.22rem;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 5px;
            display: block;
        }
        a.pub-title { color: var(--text); }
        a.pub-title:hover { color: var(--accent); text-decoration: none; }

        .pub-venue { font-size: .95rem; color: var(--muted); }
        .pub-venue em { font-style: italic; }

        .pub-note { margin-top: 8px; color: var(--muted); font-size: 1.02rem; }

        .badge {
            display: inline-block;
            font-size: .76rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-soft);
            border-radius: 5px;
            padding: 2px 7px;
            margin-right: 8px;
            vertical-align: 2px;
        }

        .pub-links { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
        .pub-links a { font-size: .93rem; color: var(--accent); }

        .pub-more { margin-top: 24px; font-size: .98rem; }

        /* ---------- Timeline ---------- */
        .timeline { border-left: 1px solid var(--border); padding-left: 26px; }

        .timeline-item { position: relative; padding-bottom: 34px; }
        .timeline-item:last-child { padding-bottom: 0; }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -31px;
            top: 7px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--bg);
            border: 2px solid var(--accent);
        }

        .timeline-date {
            font-size: .88rem;
            font-weight: 500;
            letter-spacing: .03em;
            color: var(--accent);
            margin-bottom: 3px;
        }

        .timeline-title { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; }

        .timeline-company { color: var(--muted); font-size: 1rem; margin-bottom: 12px; }

        .timeline-note { color: var(--muted); font-size: .98rem; font-style: italic; margin-bottom: 12px; }

        /* ---------- Patents / awards ---------- */
        .patent-item, .award-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }
        .patent-item:last-of-type, .award-item:last-of-type { border-bottom: none; padding-bottom: 0; }

        .patent-title, .award-title { font-weight: 500; }
        .patent-id { font-size: .92rem; color: var(--muted); font-variant-numeric: tabular-nums; }
        .award-body { color: var(--muted); font-size: 1.02rem; margin-top: 4px; }
        .award-year { color: var(--accent); font-size: .92rem; font-weight: 500; }

        /* ---------- Links / buttons ---------- */
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .explore-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            margin-top: 18px;
            background: var(--text);
            color: var(--bg);
            border-radius: 9px;
            font-size: .98rem;
            font-weight: 500;
            transition: opacity .15s, transform .15s;
        }

        .explore-button:hover { text-decoration: none; opacity: .88; transform: translateY(-1px); }

        .project-item { padding: 20px 0; border-bottom: 1px solid var(--border); }
        .project-item:last-of-type { border-bottom: none; padding-bottom: 0; }
        .project-item p { color: var(--muted); }
        .project-item p + p { margin-top: 8px; }

        .project-title {
            font-family: var(--serif);
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .back-link { padding: 40px 0; border-top: 1px solid var(--border); }
        .back-link a { color: var(--muted); font-size: .98rem; }

        .site-footer {
            border-top: 1px solid var(--border);
            padding: 28px 0 44px;
            color: var(--muted);
            font-size: .92rem;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .hero { padding: 44px 0 36px; }
            .hero-top { gap: 20px; }
            .profile-image { width: 88px; height: 88px; }
            .tab-button { flex: none; }
            .container { padding-inline: 18px; }
            .nav-inner { padding: 0 18px; gap: 12px; }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="{{ '/' | relative_url }}" class="nav-brand">Sima Didari</a>
            <div class="nav-links">
                <a href="{{ '/' | relative_url }}#research">Research</a>
                <a href="{{ '/' | relative_url }}#news">News</a>
                <a href="{{ '/' | relative_url }}#experience">Experience</a>
                <a href="{{ '/' | relative_url }}#patents">Patents</a>
                <a href="{{ '/' | relative_url }}#awards">Awards</a>
            </div>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </nav>

    <div class="container">
        {{ content }}

        <footer class="site-footer">
            <span>&copy; {{ 'now' | date: "%Y" }} Sima Didari</span>
            <span>San Jose, CA</span>
        </footer>
    </div>

    <script>
    (function () {
        // ---- Theme ----
        var root = document.documentElement;
        try {
            var saved = localStorage.getItem('theme');
            if (saved) { root.setAttribute('data-theme', saved); }
        } catch (e) {}

        var toggle = document.getElementById('themeToggle');
        if (toggle) {
            toggle.addEventListener('click', function () {
                var current = root.getAttribute('data-theme');
                if (!current) {
                    current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                var next = current === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
            });
        }

        // ---- Tabs ----
        var buttons = Array.prototype.slice.call(document.querySelectorAll('.tab-button'));
        var panels  = Array.prototype.slice.call(document.querySelectorAll('.tab-content'));
        if (!buttons.length || !panels.length) { return; }

        function selectTab(id, push) {
            var panel = document.getElementById(id);
            if (!panel) { return; }
            panels.forEach(function (p) { p.classList.toggle('active', p === panel); });
            buttons.forEach(function (b) {
                var on = b.getAttribute('data-tab') === id;
                b.classList.toggle('active', on);
                b.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            if (push && history.replaceState) { history.replaceState(null, '', '#' + id); }
        }

        buttons.forEach(function (b) {
            b.addEventListener('click', function () { selectTab(b.getAttribute('data-tab'), true); });
        });

        var initial = window.location.hash.replace('#', '');
        var valid = buttons.some(function (b) { return b.getAttribute('data-tab') === initial; });
        selectTab(valid ? initial : buttons[0].getAttribute('data-tab'), false);

        window.addEventListener('hashchange', function () {
            var id = window.location.hash.replace('#', '');
            if (buttons.some(function (b) { return b.getAttribute('data-tab') === id; })) { selectTab(id, false); }
        });
    })();
    </script>
</body>
</html>
